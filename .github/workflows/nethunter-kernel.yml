name: Build NetHunter Kernel

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Maximize Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo apt-get clean

    - name: Checkout Kernel Source
      run: |
        git clone --depth=1 https://github.com/xiaomi-mt6768-dev/android_kernel_xiaomi_mt6768.git -b lineage-20 kernel

    - name: Setup Build Environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bc bison build-essential ccache curl \
        flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
        lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
        libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
        libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
        xsltproc zip zlib1g-dev libelf-dev

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

    - name: Build Kernel
      run: |
        cd kernel
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${GITHUB_WORKSPACE}/clang/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export KBUILD_BUILD_USER="NetHunter"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        
        # Use correct defconfig
        make O=out ARCH=arm64 lime_defconfig
        
        # Add NetHunter support
        cat >> out/.config << 'EOF'
        CONFIG_TOUCHSCREEN_FTS=y
        CONFIG_TOUCHSCREEN_FOCALTECH_FTS=y
        CONFIG_TOUCHSCREEN_MTK_TOUCH=y
        CONFIG_INPUT_TOUCHSCREEN=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_WIRELESS_EXT=y
        CONFIG_WEXT_PRIV=y
        CONFIG_WEXT_CORE=y
        CONFIG_WEXT_PROC=y
        CONFIG_RTL8188EU=m
        CONFIG_88EU_AP_MODE=y
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_CONFIGFS_F_HID=y
        CONFIG_TUN=y
        CONFIG_PACKET=y
        CONFIG_NETFILTER=y
        CONFIG_NL80211_TESTMODE=y
        EOF
        
        make O=out ARCH=arm64 olddefconfig
        
        # Build
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Prepare AnyKernel3
      run: |
        cd AnyKernel3
        rm -rf .git* modules patch ramdisk
        
        cat > anykernel.sh << 'AKSCRIPT'
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=NetHunter Kernel - Redmi 9T (lime)
        do.devicecheck=1
        do.modules=1
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=lime
        device.name2=lemon
        device.name3=citrus
        supported.versions=11-13
        '; }
        
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        AKSCRIPT
        
        cp ${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz-dtb .
        
        mkdir -p modules/system/lib/modules
        find ${GITHUB_WORKSPACE}/kernel/out -name '*.ko' \
          -exec cp {} modules/system/lib/modules/ \; 2>/dev/null || true
        
        zip -r9 ../NetHunter-Kernel-$(date +%Y%m%d-%H%M).zip * \
          -x '*.git*' README.md

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Redmi9T
        path: NetHunter-Kernel-*.zip
