name: lime_defconfig
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: patch-1

      - name: Build Kernel
        run: |
          make vendor/lime_defconfig
          make -j$(nproc --all)
