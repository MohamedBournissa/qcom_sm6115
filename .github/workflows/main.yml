name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4 # تحديث للإصدار 4
        with:
          ref: patch-1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev flex bison libelf-dev gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out vendor/bengal_defconfig
          make O=out -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4 # تم التحديث إلى v4 لحل المشكلة الظاهرة في الصورة
        with:
          name: Kernel_Redmi9T
          path: out/arch/arm64/boot/Image*
