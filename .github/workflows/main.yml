name: بناء نواة النظام - ريدمي 9 تي (نت هانتر + كيرنل إس يو)

on:
  workflow_dispatch:
  push:
    branches: [ zeta ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: zeta
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Download Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Download GCC Toolchains
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git gcc-arm64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git gcc-arm

      - name: Setup KernelSU
        run: |
          curl -lsO "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
          bash setup.sh

      - name: Setup Build Environment & Config
        run: |
          echo "Setting up paths and environment..."

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc-arm64/bin:$GITHUB_WORKSPACE/gcc-arm/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="MohamedBournissa"
          export KBUILD_BUILD_HOST="GitHub_Actions"
          
          cd $GITHUB_WORKSPACE
          
          echo "=> عرض جميع ملفات الإعدادات الموجودة في المستودع (للتشخيص):"
          ls -R arch/arm64/configs/ || echo "المجلد غير موجود!"
          
          echo "=> البحث عن ملف الإعدادات (defconfig)..."
          
          DEFCONFIG=$(find arch/arm64/configs -type f -name "*defconfig" | grep -iE "juice" | grep -v "debug" | head -n 1 | sed 's|arch/arm64/configs/||')
          
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -type f -name "*defconfig" | grep -iE "chime|citrus|lime|bengal" | grep -v "debug" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi
          
          if [ -z "$DEFCONFIG" ]; then
            echo "⚠️ لم يتم العثور على الملف بالبحث التلقائي، سيتم استخدام الافتراضي..."
            DEFCONFIG="juice_defconfig"
          fi
          
          echo "✅ تم اختيار ملف الإعدادات: $DEFCONFIG"
          
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG
          
          echo "=> بدء بناء النواة..."
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- | tee out/build.log

      - name: Package Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-Redmi9T.zip * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9T-NetHunter-KSU
          path: Kernel-Redmi9T.zip

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
