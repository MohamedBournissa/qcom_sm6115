
name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: patch-1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev flex bison libelf-dev gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # هذه الخطوة تبحث عن أي ملف ينتهي بـ lime_defconfig وتستخدم مساره الصحيح
          CONF_PATH=$(find . -name "lime_defconfig" | head -n 1)
          if [ -z "$CONF_PATH" ]; then
            echo "Error: lime_defconfig not found!"
            exit 1
          fi
          echo "Found config at: $CONF_PATH"
          make O=out $(basename $CONF_PATH)
          make O=out -j$(nproc --all)
